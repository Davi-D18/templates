[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = {{ cookiecutter.description | tojson }}
authors = [
    { name = {{ cookiecutter.author_name | tojson }}, email = {{ cookiecutter.author_email | tojson }} },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
{%- if cookiecutter.dependency_manager == "poetry" %}
dependencies = [
    "fastapi[standard] (>=0.115,<1.0)",
    "sqlalchemy[asyncio] (>=2.0.30,<3.0)",
    "pydantic-settings (>=2.2,<3.0)",
    "alembic (>=1.13,<2.0)",
{%- if cookiecutter.database == "sqlite3" %}
    "aiosqlite (>=0.20)",
{%- elif cookiecutter.database == "postgresql" %}
    "asyncpg (>=0.29)",
{%- else %}
    "aiomysql (>=0.2)",
{%- endif %}
{%- if cookiecutter.use_authentication == "yes" %}
    "pyjwt (>=2.8)",
    "pwdlib[argon2] (>=0.2)",
{%- endif %}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.9.0)",
    "pre-commit (>=4.0.0)",
{%- if cookiecutter.use_tests == "yes" %}
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.24.0)",
    "pytest-cov (>=4.0.0)",
    "httpx (>=0.27)",
{%- endif %}
]
{%- endif %}

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

{%- if cookiecutter.use_tests == "yes" %}
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
{%- endif %}
